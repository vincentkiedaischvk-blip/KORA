<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KORA Safety — Demo</title>
<style>
/* Lokal gehostet. Ein Request an fonts.googleapis.com überträgt die IP jedes
   Besuchers an Google — dafür gab es in Deutschland reihenweise Abmahnungen,
   und Abschnitt 5 der Datenschutzerklärung sagt ausdrücklich, dass es nicht
   passiert. Siehe landing/legal/datenschutz.html. */
@font-face{font-family:Inter;src:url(../brand/fonts/Inter-Regular.ttf) format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(../brand/fonts/Inter-Medium.ttf) format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:Inter;src:url(../brand/fonts/Inter-SemiBold.ttf) format('truetype');font-weight:600;font-display:swap}
@font-face{font-family:Inter;src:url(../brand/fonts/InterDisplay-Bold.ttf) format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:Inter;src:url(../brand/fonts/InterDisplay-ExtraBold.ttf) format('truetype');font-weight:800;font-display:swap}
@font-face{font-family:Inter;src:url(../brand/fonts/InterDisplay-Black.ttf) format('truetype');font-weight:900;font-display:swap}
</style>
<style>
:root{
  --bg:#F4F4F2; --card:#FFFFFF; --ink:#0A0A0A; --grey:#8A8A8A; --grey2:#6E6E6E;
  --lime:#C8F169; --line:#E4E4E0; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Kopf ─────────────────────────────────────── */
header{position:sticky;top:0;z-index:50;background:rgba(244,244,242,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:18px 28px;display:flex;align-items:center;gap:24px}
.logo{font-weight:800;font-size:21px;letter-spacing:.02em}
.logo span{color:var(--grey)}
.tabs{display:flex;gap:4px;background:#EAEAE6;padding:4px;border-radius:999px;margin-left:8px}
.tabs button{padding:9px 20px;border-radius:999px;font-size:14px;font-weight:600;color:var(--grey2);transition:.18s}
.tabs button.on{background:var(--ink);color:#fff}
.spacer{flex:1}
.reset{font-size:13px;font-weight:600;color:var(--grey);padding:8px 14px;border-radius:999px}
.reset:hover{color:var(--ink);background:#EAEAE6}
.badge-dot{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;background:var(--lime);color:var(--ink);border-radius:999px;font-size:11px;font-weight:800;margin-left:7px}

main{max-width:1180px;margin:0 auto;padding:40px 28px 100px}

/* ── Bausteine ────────────────────────────────── */
.pill{display:inline-block;padding:7px 15px;border-radius:999px;background:var(--lime);font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.pill.grey{background:#EAEAE6;color:var(--grey2)}
.pill.ink{background:var(--ink);color:#fff}
h1{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1.05;margin:18px 0 10px}
h1 em{font-style:normal;color:var(--grey)}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.sub{color:var(--grey2);font-size:15.5px;max-width:60ch}
.card{background:var(--card);border-radius:var(--r);padding:26px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row{display:flex;gap:16px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:#fff;padding:15px 28px;border-radius:999px;font-weight:700;font-size:15px;transition:.18s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.32;cursor:not-allowed;transform:none}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.ghost{background:#EAEAE6;color:var(--ink)}
.btn.sm{padding:11px 20px;font-size:14px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--grey);margin-bottom:7px}
input,select{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;background:#fff;color:var(--ink)}
input:focus,select:focus{border-color:var(--ink);outline:none}
.field{margin-bottom:18px}
.muted{color:var(--grey);font-size:13.5px}
.mono{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);margin:22px 0}

/* ── Schritte ─────────────────────────────────── */
.steps{display:flex;gap:8px;align-items:center;margin-bottom:32px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--grey);padding:9px 16px;border-radius:999px;background:#EAEAE6}
.step.on{background:var(--ink);color:#fff}
.step.done{background:var(--lime);color:var(--ink)}
.step i{font-style:normal;font-weight:800;font-size:11px}

/* ── Anfrage-/Angebotskarten ──────────────────── */
.req{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:22px 24px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;transition:.18s;border:2px solid transparent}
.req:hover{transform:translateY(-2px)}
.req.sel{border-color:var(--ink)}
.req h3{font-size:20px;font-weight:800;letter-spacing:-.01em}
.req .meta{color:var(--grey2);font-size:14px;margin-top:5px}

.offer{background:var(--card);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);border:2px solid transparent;transition:.2s}
.offer.mine{border-color:var(--lime)}
.offer.won{border-color:var(--ink)}
.offer .name{font-size:20px;font-weight:800}
.offer .price{font-size:34px;font-weight:900;letter-spacing:-.02em;margin:14px 0 4px}
.check{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--grey2);font-weight:500}
.check svg{flex:0 0 auto}

/* ── Drag & Drop ──────────────────────────────── */
.dnd{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;align-items:start}
.pool{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow-y:auto;padding-right:4px}
.guard{display:flex;align-items:center;gap:13px;padding:13px 15px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);cursor:grab;transition:.15s;border:2px solid transparent;user-select:none}
.guard:active{cursor:grabbing}
.guard.drag{opacity:.35}
.guard.busy{opacity:.4;cursor:not-allowed}
.guard.placed{display:none}
.av{width:38px;height:38px;border-radius:999px;background:var(--lime);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 auto}
.av.grey{background:#E4E4E0;color:var(--grey2)}
.guard .info{flex:1;min-width:0}
.guard .nm{font-weight:700;font-size:15px}
.guard .ql{font-size:12.5px;color:var(--grey)}
.guard .rt{font-weight:800;font-size:15px;white-space:nowrap}

.slots{background:#EDEDE9;border-radius:var(--r);padding:20px;border:2px dashed var(--line);min-height:200px;transition:.18s}
.slots.over{border-color:var(--ink);background:#E6E6E0}
.slotgrid{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.slot{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:13px;border:1.5px dashed #D4D4CE;color:var(--grey);font-size:14px;font-weight:600;background:rgba(255,255,255,.5)}
.slot.filled{border:1.5px solid transparent;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.slot .x{margin-left:auto;font-size:20px;color:var(--grey);padding:0 6px;line-height:1}
.slot .x:hover{color:#C0392B}

.calc{margin-top:20px}
.calc .ln{display:flex;justify-content:space-between;padding:9px 0;font-size:15px;color:var(--grey2)}
.calc .ln b{color:var(--ink);font-weight:700}
.calc .total{display:flex;justify-content:space-between;align-items:baseline;padding-top:16px;border-top:2px solid var(--ink);margin-top:8px}
.calc .total span{font-size:15px;font-weight:700}
.calc .total b{font-size:32px;font-weight:900;letter-spacing:-.02em}
input[type=range]{width:100%;accent-color:var(--ink);padding:0;border:none}

/* ── Zustände ─────────────────────────────────── */
.empty{text-align:center;padding:70px 20px;color:var(--grey)}
.empty .big{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:8px}
.load{display:flex;align-items:center;gap:12px;color:var(--grey2);font-size:15px;font-weight:600}
.dot{width:9px;height:9px;border-radius:999px;background:var(--lime);animation:pp 1.1s infinite}
@keyframes pp{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.appear{animation:up .38s cubic-bezier(.2,.7,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.won-note{background:var(--lime);border-radius:var(--r);padding:22px 26px;margin-bottom:22px;font-weight:700;font-size:17px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:15px 26px;border-radius:999px;font-weight:600;font-size:15px;box-shadow:0 12px 32px rgba(0,0,0,.25);z-index:99;animation:up .3s both}

/* ── Matching-Panel ───────────────────────────── */
.match{background:var(--card);border-radius:var(--r);padding:22px 26px;box-shadow:var(--shadow);margin-bottom:22px}
.funnel{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:16px 0 4px}
.fstep{flex:1;min-width:104px;padding:0 16px;border-left:2px solid var(--line)}
.fstep:first-child{padding-left:0;border-left:none}
.fstep b{display:block;font-size:27px;font-weight:900;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.fstep span{font-size:12px;color:var(--grey);font-weight:600}
.fstep.on b{color:var(--ink)}
.fstep.off b{color:#C9C9C4}
.why{list-style:none;margin:10px 0 0;display:flex;flex-direction:column;gap:5px}
.why li{font-size:13px;color:var(--grey2);display:flex;gap:7px;align-items:baseline}
.why li::before{content:"";width:4px;height:4px;border-radius:999px;background:var(--lime);flex:none;transform:translateY(-3px)}
.score{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);font-variant-numeric:tabular-nums}
.rejtoggle{font-size:13px;font-weight:700;color:var(--grey2);text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.rejtoggle:hover{color:var(--ink)}
.rej{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.rej .ln{display:flex;justify-content:space-between;gap:16px;font-size:13.5px;padding:5px 0;color:var(--grey2)}
.rej .ln b{font-variant-numeric:tabular-nums;color:var(--ink)}

@media(max-width:900px){
  .dnd,.grid2{grid-template-columns:1fr}
  h1{font-size:32px}
  .bar{padding:14px 18px;flex-wrap:wrap;gap:12px}
  main{padding:28px 18px 80px}
  .pool{max-height:300px}
  .fstep{min-width:84px;padding:0 10px}
  .fstep b{font-size:21px}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo">KORA <span>SAFETY</span></div>
    <div class="tabs">
      <button id="tabK" class="on" onclick="setView('kunde')">Unternehmen</button>
      <button id="tabA" onclick="setView('anbieter')">Anbieter<span id="inboxDot" class="badge-dot" style="display:none">1</span></button>
    </div>
    <div class="spacer"></div>
    <button class="reset" onclick="resetAll()">Demo zurücksetzen</button>
  </div>
</header>

<main id="app"></main>

<!-- Anbieter-Pool und Matching. Beides ohne Build, beides file://-fähig. -->
<script src="../data/providers.js"></script>
<script src="matching.js"></script>

<script>
/* ═══════════════════════════════════════════════════════
   Zustand
   ═══════════════════════════════════════════════════════ */
const GUARDS = [
  {id:1, name:"Max Berger",     qual:"Sachkunde § 34a",    rate:26, busy:false},
  {id:2, name:"Leon Kaya",      qual:"Sachkunde § 34a",    rate:26, busy:false},
  {id:3, name:"Tim Roth",       qual:"Unterrichtung",      rate:22, busy:false},
  {id:4, name:"Sara Nowak",     qual:"Sachkunde § 34a",    rate:27, busy:false},
  {id:5, name:"Jonas Weiß",     qual:"Unterrichtung",      rate:22, busy:false},
  {id:6, name:"Elif Demir",     qual:"Meister f. Schutz",  rate:34, busy:false},
  {id:7, name:"Paul Hartmann",  qual:"Unterrichtung",      rate:22, busy:false},
  {id:8, name:"Nina Falk",      qual:"Sachkunde § 34a",    rate:26, busy:false},
  {id:9, name:"Ali Yıldız",     qual:"Sachkunde § 34a",    rate:27, busy:false},
  {id:10,name:"Marek Kowal",    qual:"Im Einsatz bis 22 h",rate:24, busy:true},
  {id:11,name:"Jana Petrova",   qual:"Im Einsatz bis 02 h",rate:24, busy:true},
];

/* Anbieter-Pool aus data/providers.js. Fehlt die Datei, läuft die Demo
   weiter — dann eben ohne Matching-Panel, statt mit einem leeren Bildschirm. */
const POOL = (window.KORA_PROVIDERS && window.KORA_PROVIDERS.anbieter) || [];
const STAEDTE = [...new Set(POOL.map(p => p.stadt))].sort((a,b) =>
  POOL.filter(p=>p.stadt===b).length - POOL.filter(p=>p.stadt===a).length);

const BLANK = {
  view:"kunde",
  step:1,                 // 1 Anfrage · 2 Angebote · 3 beauftragt
  request:null,
  match:null,             // Ergebnis von KORAMatch.match
  offers:[],
  awarded:null,
  placed:[],              // Wach-IDs im Einsatzplan
  margin:28,
  submitted:false,
  showRejects:false,      // Ausschlussliste aufgeklappt
  guards:JSON.parse(JSON.stringify(GUARDS))
};
let S = JSON.parse(JSON.stringify(BLANK));

function resetAll(){ S = JSON.parse(JSON.stringify(BLANK)); render(); toast("Demo zurückgesetzt"); }
function setView(v){ S.view = v; render(); }

function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

const eur = n => new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const TICK = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3L13 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ═══════════════════════════════════════════════════════
   Ansicht: Unternehmen
   ═══════════════════════════════════════════════════════ */
function viewKunde(){
  const st = n => S.step>n ? 'done' : (S.step===n ? 'on' : '');
  let h = `<div class="steps">
    <div class="step ${st(1)}"><i>01</i> Bedarf eingeben</div>
    <div class="step ${st(2)}"><i>02</i> Angebote erhalten</div>
    <div class="step ${st(3)}"><i>03</i> Beauftragen</div>
  </div>`;

  if(S.step===1){
    h += `<span class="pill">Neue Anfrage</span>
    <h1>Einmal eingeben.<br><em>Mehrere Angebote erhalten.</em></h1>
    <p class="sub">Beschreiben Sie Ihren Bedarf. KORA leitet die Anfrage an geprüfte Sicherheitsdienstleister in Ihrer Region weiter.</p>
    <div class="card" style="margin-top:28px;max-width:760px">
      <div class="grid2">
        <div class="field"><label>Anlass</label>
          <select id="f_anlass">
            <option>Event Security</option><option>Objektschutz</option>
            <option>Baustellenbewachung</option><option>Empfangsdienst</option>
          </select></div>
        <div class="field"><label>Ort</label>
          <select id="f_ort">${STAEDTE.map(s =>
            `<option${s==='Berlin'?' selected':''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Datum</label><input id="f_datum" type="date" value="2026-09-05"></div>
        <div class="field"><label>Anzahl Kräfte</label>
          <select id="f_anzahl"><option>4</option><option selected>6</option><option>8</option><option>12</option></select></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Von</label><input id="f_von" type="time" value="18:00"></div>
        <div class="field"><label>Bis</label><input id="f_bis" type="time" value="02:00"></div>
      </div>
      <div class="field" style="margin-bottom:24px"><label>Anforderung</label>
        <select id="f_anf">
          <option>Sachkunde § 34a erforderlich</option>
          <option>Unterrichtung nach § 34a genügt</option>
          <option>Einsatzleitung vor Ort erforderlich</option>
        </select></div>
      <button class="btn" onclick="sendRequest()">Anfrage stellen ${arrow()}</button>
      <p class="muted" style="margin-top:14px">Kostenlos · Unverbindlich · Keine Vertragsbindung</p>
    </div>`;
  }

  if(S.step===2){
    const r = S.request;
    h += `<span class="pill grey">Anfrage läuft</span>
    <h1>${r.anlass} · ${r.ort}</h1>
    <p class="sub">${r.anzahl} Kräfte · ${r.datum} · ${r.von}–${r.bis} Uhr · ${r.anf}</p>
    <div class="hr"></div>`;

    h += matchBlock();

    if(S.offers.length===0){
      h += `<div class="card"><div class="load"><span class="dot"></span> Passende Anbieter werden benachrichtigt …</div></div>`;
    } else {
      h += `<h2 style="margin-bottom:16px">${S.offers.length} Angebote eingegangen</h2>
        <div class="grid2" style="align-items:start">`;
      S.offers.forEach((o,i)=>{
        h += `<div class="offer ${o.mine?'mine':''} appear" style="animation-delay:${i*70}ms">
          <div class="row" style="justify-content:space-between">
            <div class="name">${o.name}</div>
            ${o.mine?'<span class="pill" style="font-size:10px">Ihr Angebot</span>':''}
          </div>
          <div class="check" style="margin-top:9px">${TICK} Geprüfter Anbieter</div>
          <div class="check">${TICK} ${o.note}</div>
          <div class="price mono">${eur(o.price)}</div>
          <p class="muted">${eur(o.price/(r.anzahl*r.stunden))} pro Kraft und Stunde · zzgl. USt.</p>
          <div class="hr" style="margin:18px 0"></div>
          <button class="btn sm" onclick="award(${o.id})">Beauftragen</button>
        </div>`;
      });
      h += `</div>`;
    }
  }

  if(S.step===3){
    const o = S.offers.find(x=>x.id===S.awarded);
    h += `<div class="won-note appear">${TICK} Auftrag an ${o.name} erteilt · ${eur(o.price)}</div>
    <span class="pill ink">Beauftragt</span>
    <h1>Fertig.<br><em>In unter zwei Minuten.</em></h1>
    <p class="sub">${o.name} wurde benachrichtigt und bestätigt den Einsatz. Alle Unterlagen und Nachweise liegen in Ihrem KORA-Konto.</p>
    <div class="card" style="margin-top:26px;max-width:620px">
      <h2>${S.request.anlass} · ${S.request.ort}</h2>
      <p class="muted" style="margin-bottom:18px">${S.request.anzahl} Kräfte · ${S.request.datum} · ${S.request.von}–${S.request.bis} Uhr</p>
      <div class="calc">
        <div class="ln"><span>Anbieter</span><b>${o.name}</b></div>
        <div class="ln"><span>Status</span><b>Bestätigt</b></div>
        <div class="total"><span>Auftragswert</span><b class="mono">${eur(o.price)}</b></div>
      </div>
    </div>
    <button class="btn ghost" style="margin-top:24px" onclick="resetAll()">Neue Anfrage starten</button>`;
  }
  return h;
}

/* Zeigt, wie aus 121 Betrieben drei Angebote werden. Der Trichter ist der
   eigentliche Produktkern — ohne ihn ist KORA ein Formular, das Mails
   verschickt. Deshalb steht er sichtbar über den Angeboten und nicht in
   einem Log. */
function matchBlock(){
  const m = S.match;
  if(!m) return '';
  const s = m.stats;
  const top = m.eligible.slice(0, KORAMatch.EINLADUNGEN);

  let h = `<div class="match appear">
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <h2>Zuordnung</h2>
      <span class="score">${s.geeignet} von ${s.pool} geeignet</span>
    </div>
    <div class="funnel">
      <div class="fstep on"><b>${s.pool}</b><span>im Netzwerk</span></div>
      <div class="fstep ${s.in_region?'on':'off'}"><b>${s.in_region}</b><span>in ${S.request.ort}</span></div>
      <div class="fstep ${s.geeignet?'on':'off'}"><b>${s.geeignet}</b><span>erfüllen die Anforderung</span></div>
      <div class="fstep ${s.eingeladen?'on':'off'}"><b>${s.eingeladen}</b><span>angefragt</span></div>
    </div>`;

  if(!s.geeignet){
    h += `<p class="muted" style="margin-top:14px">Kein Betrieb in ${S.request.ort} erfüllt diese
      Anforderung. In der echten Anwendung würde KORA hier den Radius erweitern
      statt eine leere Liste zu zeigen.</p>`;
  } else {
    h += `<div class="hr" style="margin:18px 0"></div>
      <h2 style="font-size:15px">Angefragt wurden</h2>
      <div class="grid2" style="margin-top:12px;align-items:start">`;
    top.forEach(p => {
      h += `<div>
        <div class="row" style="justify-content:space-between;align-items:baseline">
          <div class="name" style="font-weight:700">${p.name}</div>
          <span class="score">${(p.score*100).toFixed(0)}</span>
        </div>
        <ul class="why">${p.gruende.map(g=>`<li>${g}</li>`).join('')}</ul>
      </div>`;
    });
    h += `</div>`;
  }

  const gruende = Object.entries(s.ausschluesse);
  if(gruende.length){
    h += `<div style="margin-top:16px">
      <button class="rejtoggle" onclick="toggleRejects()">
        ${S.showRejects?'Ausschlüsse ausblenden':`Warum ${m.rejected.length} Betriebe nicht angefragt wurden`}
      </button>`;
    if(S.showRejects){
      h += `<div class="rej">${gruende.map(([g,n])=>
        `<div class="ln"><span>${g}</span><b>${n}</b></div>`).join('')}</div>`;
    }
    h += `</div>`;
  }

  return h + `</div>`;
}

function toggleRejects(){ S.showRejects = !S.showRejects; render(); }

function arrow(){ return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h11M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }

function sendRequest(){
  const g = id => document.getElementById(id).value;
  const von = g('f_von'), bis = g('f_bis');
  let std = (parseInt(bis)-parseInt(von)+24)%24 || 8;
  S.request = {
    anlass:g('f_anlass'), ort:g('f_ort'),
    datum:new Date(g('f_datum')).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}),
    anzahl:parseInt(g('f_anzahl')), von, bis, anf:g('f_anf'), stunden:std
  };
  // Zuordnung gegen den Pool. Läuft synchron, 121 Betriebe sind kein Problem.
  S.match = POOL.length ? KORAMatch.match(S.request, POOL) : null;
  S.step = 2;
  render();
  document.getElementById('inboxDot').style.display='inline-flex';
  setTimeout(()=>{ if(S.step===2 && S.offers.length===0){ toast("Neue Anfrage im Anbieter-Postfach"); } }, 900);
}

function award(id){
  S.awarded = id; S.step = 3;
  const o = S.offers.find(x=>x.id===id);
  render();
  toast(o.mine ? "Sie haben den Auftrag erhalten" : "Auftrag erteilt");
}

/* ═══════════════════════════════════════════════════════
   Ansicht: Anbieter
   ═══════════════════════════════════════════════════════ */
function viewAnbieter(){
  if(!S.request){
    return `<span class="pill grey">Postfach</span>
      <h1>Keine offenen<br><em>Anfragen.</em></h1>
      <p class="sub">Wechseln Sie in die Ansicht „Unternehmen" und stellen Sie eine Anfrage — sie erscheint dann hier.</p>
      <button class="btn" style="margin-top:26px" onclick="setView('kunde')">Zur Unternehmensansicht ${arrow()}</button>`;
  }
  const r = S.request;
  const won = S.awarded && S.offers.find(o=>o.id===S.awarded)?.mine;

  let h = '';
  if(won) h += `<div class="won-note appear">${TICK} Auftrag erhalten · ${r.anlass} · ${r.ort} · ${eur(myPrice())}</div>`;

  h += `<span class="pill">${S.submitted?'Angebot abgegeben':'Neue Anfrage'}</span>
  <h1>${r.anlass} · ${r.ort}</h1>
  <p class="sub">${r.anzahl} Kräfte · ${r.datum} · ${r.von}–${r.bis} Uhr · ${r.stunden} Stunden · ${r.anf}</p>
  <div class="hr"></div>
  <h2>Einsatz besetzen</h2>
  <p class="muted" style="margin-bottom:22px">Ziehen Sie Mitarbeiter aus der Liste in den Einsatzplan. Der Preis berechnet sich automatisch.</p>

  <div class="dnd">
    <div>
      <label>Verfügbare Mitarbeiter</label>
      <div class="pool" id="pool">${S.guards.map(gd=>guardCard(gd)).join('')}</div>
    </div>

    <div>
      <label>Einsatzplan · ${S.placed.length} von ${r.anzahl} besetzt</label>
      <div class="slots" id="drop" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event)">
        <div class="row" style="justify-content:space-between">
          <b style="font-size:15px">${r.von}–${r.bis} Uhr</b>
          <span class="muted mono">${r.stunden} h je Kraft</span>
        </div>
        <div class="slotgrid">${slotList()}</div>
      </div>
      ${calcBlock()}
    </div>
  </div>`;
  return h;
}

function guardCard(g){
  const placed = S.placed.includes(g.id);
  const cls = `guard${g.busy?' busy':''}${placed?' placed':''}`;
  return `<div class="${cls}" ${g.busy||S.submitted?'':'draggable="true"'}
      ondragstart="dragStart(event,${g.id})" ondragend="dragEnd(event)" data-id="${g.id}">
    <div class="av ${g.busy?'grey':''}">${g.name.split(' ').map(n=>n[0]).join('')}</div>
    <div class="info"><div class="nm">${g.name}</div><div class="ql">${g.qual}</div></div>
    <div class="rt mono">${g.rate} €/h</div>
  </div>`;
}

function slotList(){
  const need = S.request.anzahl;
  let out = '';
  for(let i=0;i<need;i++){
    const gid = S.placed[i];
    if(gid!==undefined){
      const g = S.guards.find(x=>x.id===gid);
      out += `<div class="slot filled">
        <div class="av" style="width:30px;height:30px;font-size:12px">${g.name.split(' ').map(n=>n[0]).join('')}</div>
        <div><b style="font-size:14.5px">${g.name}</b><div class="ql" style="font-size:12px;color:var(--grey)">${g.qual}</div></div>
        ${S.submitted?'':`<button class="x" onclick="removeGuard(${g.id})" title="Entfernen">×</button>`}
      </div>`;
    } else {
      out += `<div class="slot">Position ${i+1} — Mitarbeiter hierher ziehen</div>`;
    }
  }
  return out;
}

function myPrice(){
  const r = S.request;
  const cost = S.placed.reduce((s,id)=> s + S.guards.find(g=>g.id===id).rate * r.stunden, 0);
  return Math.round(cost * (1 + S.margin/100));
}

function calcBlock(){
  const r = S.request;
  const cost = S.placed.reduce((s,id)=> s + S.guards.find(g=>g.id===id).rate * r.stunden, 0);
  const total = myPrice();
  const full = S.placed.length === r.anzahl;
  return `<div class="card calc" style="margin-top:18px">
    <div class="ln"><span>Personalkosten (${S.placed.length} × ${r.stunden} h)</span><b class="mono">${eur(cost)}</b></div>
    <div class="ln" style="display:block;padding-top:14px">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <span>Aufschlag</span><b class="mono">${S.margin} %</b>
      </div>
      <input type="range" min="10" max="50" value="${S.margin}" ${S.submitted?'disabled':''}
        oninput="S.margin=+this.value; render()">
    </div>
    <div class="total"><span>Angebotssumme</span><b class="mono">${eur(total)}</b></div>
    <p class="muted" style="margin-top:8px">zzgl. USt. · Deckungsbeitrag ${eur(total-cost)}</p>
    <div style="margin-top:20px">
      ${S.submitted
        ? `<button class="btn ghost" disabled>Angebot abgegeben ${TICK}</button>`
        : `<button class="btn" ${full?'':'disabled'} onclick="submitOffer()">Angebot abgeben ${arrow()}</button>
           ${full?'':'<p class="muted" style="margin-top:12px">Erst alle Positionen besetzen.</p>'}`}
    </div>
  </div>`;
}

/* ── Drag & Drop ── */
let dragId = null;
function dragStart(e,id){ if(S.submitted) return; dragId=id; e.currentTarget.classList.add('drag'); e.dataTransfer.effectAllowed='move'; }
function dragEnd(e){ e.currentTarget.classList.remove('drag'); }
function dragOver(e){ e.preventDefault(); e.currentTarget.classList.add('over'); }
function dragLeave(e){ e.currentTarget.classList.remove('over'); }
function drop(e){
  e.preventDefault(); e.currentTarget.classList.remove('over');
  if(dragId===null || S.submitted) return;
  const g = S.guards.find(x=>x.id===dragId);
  if(g.busy || S.placed.includes(dragId) || S.placed.length >= S.request.anzahl){ dragId=null; return; }
  S.placed.push(dragId); dragId=null; render();
}
function removeGuard(id){ S.placed = S.placed.filter(x=>x!==id); render(); }

function submitOffer(){
  const price = myPrice();
  S.submitted = true;
  S.offers.push({id:1, name:"Ihr Unternehmen", price, mine:true,
                 note:`${S.placed.length} Kräfte fest zugeteilt`});

  // Der Wettbewerb ist nicht erfunden, sondern die bestbewerteten Treffer aus
  // der Zuordnung. Ihr Preis ergibt sich aus dem eigenen Stundensatz, nicht aus
  // einem Aufschlag auf Ihren — sonst gewinnt man immer knapp und lernt nichts.
  const rivals = (S.match ? S.match.eligible : [])
    .slice(0, KORAMatch.EINLADUNGEN - 1)
    .map((p, i) => ({
      id: i + 2,
      name: p.name,
      price: Math.round(p.preis_eur / 10) * 10,
      note: rivalNote(p),
      // Wer schneller antwortet, ist auch im Postfach früher da.
      delay: 900 + p.reaktion_min * 22,
    }));

  render();
  toast("Angebot abgegeben");
  rivals.forEach(rv=>{
    setTimeout(()=>{
      S.offers.push({id:rv.id, name:rv.name, price:rv.price, mine:false, note:rv.note});
      S.offers.sort((a,b)=>a.price-b.price);
      render();
      if(S.view==='kunde') toast(`Neues Angebot: ${rv.name}`);
    }, rv.delay);
  });
}

/* Das Argument, mit dem ein Anbieter in die Liste geht. */
function rivalNote(p){
  if(p.einsatzleitung && p.sachkunde_34a) return "Einsatzleitung und Sachkunde § 34a";
  if(p.einsatzleitung) return "Einsatzleitung inklusive";
  if(p.sachkunde_34a) return "Sachkunde § 34a im Bestand";
  return `${p.bewertung.toFixed(1)} Sterne aus ${p.bewertungen} Bewertungen`;
}

/* ═══════════════════════════════════════════════════════
   Render
   ═══════════════════════════════════════════════════════ */
function render(){
  document.getElementById('tabK').className = S.view==='kunde' ? 'on':'';
  document.getElementById('tabA').className = S.view==='anbieter' ? 'on':'';
  const dot = document.getElementById('inboxDot');
  dot.style.display = (S.request && !S.submitted) ? 'inline-flex' : 'none';
  document.getElementById('app').innerHTML = S.view==='kunde' ? viewKunde() : viewAnbieter();
}
render();

/* Direkteinstieg für Vorführung und Aufnahme. Ohne das beginnt jeder Durchlauf
   beim leeren Formular — für einen Screenshot der Zuordnung oder ein Video, das
   mitten im Ablauf einsetzt, ist das der falsche Startpunkt.

     ?schritt=2   Anfrage abgeschickt, Zuordnung sichtbar
     ?schritt=2&gruende=1   dazu die Ausschlussliste aufgeklappt
     ?ansicht=anbieter      direkt in die Anbieteransicht

   Die Werte des Formulars lassen sich überschreiben:
     ?ort=Hamburg&anzahl=12&anlass=Objektschutz
*/
(function deepLink(){
  const q = new URLSearchParams(location.search);
  if(![...q.keys()].length) return;

  const setzen = (id, wert) => {
    const el = document.getElementById(id);
    if(el && wert) el.value = wert;
  };
  setzen('f_ort', q.get('ort'));
  setzen('f_anlass', q.get('anlass'));
  setzen('f_anzahl', q.get('anzahl'));
  setzen('f_anf', q.get('anf'));

  if(q.get('schritt') === '2' || q.get('schritt') === '3'){
    sendRequest();
    if(q.get('gruende')) S.showRejects = true;
  }
  if(q.get('ansicht') === 'anbieter') S.view = 'anbieter';
  render();
})();
</script>
</body>
